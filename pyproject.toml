[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "operon"
version = "0.1.0"
description = "Autonomous Enterprise AI Task Worker built with LangGraph and Groq (Qwen 3.8 27B)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Operon Team" }
]
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "pypdf>=3.0.0"
]

[project.scripts]
operon = "cli:main"

[tool.setuptools.packages.find]
include = ["operon*"]
